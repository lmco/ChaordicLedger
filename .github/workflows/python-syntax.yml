name: Python syntax

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check tracked Python files
        run: git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile
